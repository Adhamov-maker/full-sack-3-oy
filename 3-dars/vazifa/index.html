<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devfinder</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="navbar container">
        <img class="logo" src="./img/devfinder.png" alt="Brand-logo" />
        <div class="nav-dark">
          <p class="dark-p">LIGHT</p>
          <img class="theme-img" src="./img/sun.svg" alt="theme-icon" />
        </div>
      </div>
      <div class="hero container">
        <form class="search-form" action="">
          <label for="search-input" class="search-label">
            <img src="./img/Combined-Shape.svg" alt="izlash-ikonkasi" />
          </label>
          <input
            id="search-input"
            class="search-input"
            type="text"
            placeholder="Search GitHub username…"
          />
          <button type="submit" class="search-btn">Search</button>
        </form>
      </div>
      <div class="card">
        <div class="main container">
          <div class="main-img">
            <img src="./img/cat-img.png" alt="Bitmap" />
          </div>
          <div class="main-title">
            <div class="sarlavha">
              <div class="sarlavha-title">
                <h2>The Octocat</h2>
                <p>Joined 25 Jan 2011</p>
              </div>
              <a href="#">@octocat</a>
              <p>This profile has no bio</p>
            </div>
            <div class="reyting">
              <div class="repos">
                <p>Repos</p>
                <h4>8</h4>
              </div>
              <div class="repos">
                <p>Followers</p>
                <h4>3938</h4>
              </div>
              <div class="repos">
                <p>Following</p>
                <h4>9</h4>
              </div>
            </div>
            <div class="call">
              <div class="cards">
                <div class="card">
                  <i class="glyph glyph-d"></i>
                  <p>San Francisco</p>
                </div>
                <div class="card">
                  <i class="glyph glyph-c"></i>
                  <p>https://github.blog</p>
                </div>
              </div>
              <div class="cards">
                <div class="card">
                  <i class="glyph glyph-a"></i>
                  <p>Not Available</p>
                </div>
                <div class="card">
                  <i class="glyph glyph-b"></i>
                  <p>@github</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Agar papkangiz nomi rostdan ham "ls" bo'lsa, "./ls/app.js" qoldiring -->
    <script src="./ls/app.js"></script>
  </body>
</html>
